[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metaboleer"
version = "0.1.0"
description = "Metabolomics network pipeline: WGCNA modules + Gaussian graphical model + p-gain, exported as an interactive D3 network"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3",
  "matplotlib>=3.7", "networkx>=3.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
metaboleer = "metaboleer.cli:main"

[tool.setuptools.packages.find]
include = ["metaboleer*"]

[tool.setuptools.package-data]
metaboleer = ["templates/*.html"]
